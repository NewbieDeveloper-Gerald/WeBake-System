<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Check the latest status of a Crumbs N' Roll Bakery order using its order ID and checkout email.">
  <title>Order Status — WeBake</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/globals.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/products.css">
  <style>
    .track-wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .track-card { background: #fff; border-radius: 14px; padding: 1.75rem; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    .track-card h4 { margin: 0 0 .75rem; color: var(--primary, #6B352A); }
    #track-error { display: none; color: var(--danger, #c0392b); margin-top: .75rem; }
    #track-result { display: none; }
    #track-status-pill { display: inline-block; background: var(--accent-soft, #FFF9D2); color: var(--primary, #6B352A); font-weight: 700; border-radius: 9999px; padding: .3rem 1rem; margin: .5rem 0 1rem; }
    .tl-step { display: flex; align-items: center; gap: .6rem; padding: .3rem 0; color: #999; }
    .tl-step .tl-dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; flex: none; }
    .tl-step.done { color: var(--primary, #6B352A); }
    .tl-step.done .tl-dot { background: var(--success, #28a745); }
    .tl-step.now { color: var(--primary, #6B352A); font-weight: 700; }
    .tl-step.now .tl-dot { background: var(--accent, #e8a13c); }
    .tl-step.cancelled .tl-dot { background: var(--danger, #c0392b); }
    .review-line { display: flex; justify-content: space-between; padding: .3rem 0; border-bottom: 1px dashed #eee; }
    .pending-note { background: #E0F2FE; border-radius: 8px; padding: .8rem 1rem; }
    .reject-note { background: #FDE8E8; border-radius: 8px; padding: .8rem 1rem; }
    .ok-note { background: #EAF7ED; border-radius: 8px; padding: .8rem 1rem; }
  </style>
  <link rel="stylesheet" href="../css/storefront-refresh.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="header">
    <nav class="nav container">
      <a href="home.html" class="logo" aria-label="WeBake Home">
        <img src="../img/webake-logo.png" alt="WeBake — Crumbs N' Roll Bakery" class="logo-img">
      </a>
      <div class="nav-right">
        <div class="nav-links" id="nav-links">
          <a href="home.html">Home</a>
          <a href="products.html">Products</a>
          <a href="track.html" data-track-order-open class="active">Order Status</a>
          <a href="home.html#about">About Us</a>
          <a href="home.html#contact">Contact</a>
        </div>
        <div class="auth-buttons">
          <button type="button" data-auth-open="login" class="btn btn-outline btn-sm">Sign In</button>
          <button type="button" data-auth-open="register" class="btn btn-primary btn-sm">Register</button>
        </div>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle menu" aria-controls="nav-links" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </nav>
  </header>

  <main class="track-wrap" id="main-content">
    <div class="track-card">
      <h1 data-i18n="nav.track">Order Status</h1>
      <form id="track-lookup">
        <div class="form-row">
          <div class="form-group">
            <label for="track-code">Order ID</label>
            <input class="form-input" id="track-code" placeholder="WB-XXXXX" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="track-email">Gmail used for the order</label>
            <input class="form-input" id="track-email" type="email" placeholder="you@gmail.com" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="track-btn">Check Status</button>
        <div id="track-error"></div>
      </form>
    </div>

    <div id="track-result">
      <div class="track-card">
        <h2 id="track-order-code"></h2>
        <div><span id="track-status-pill"></span></div>
        <div id="track-timeline"></div>
      </div>
      <div class="track-card">
        <h4>Items</h4>
        <div id="track-items"></div>
        <div id="track-amounts" style="margin-top:.75rem;"></div>
      </div>
      <div class="track-card" id="track-payment-card">
        <div id="track-payment"></div>
      </div>
      <div class="track-card" id="track-refund-card">
        <div id="track-refund"></div>
      </div>
      <div class="track-card" id="track-cancel-card">
        <div id="track-cancel"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <a href="home.html" class="logo" aria-label="WeBake Home">
            <img src="../img/webake-logo.png" alt="WeBake — Crumbs N' Roll Bakery" class="logo-img">
          </a>
          <p>Crumbs N' Roll Bakery</p>
        </div>
                <nav class="footer-nav" aria-label="Footer navigation">
          <a href="home.html#home">Home</a>
          <a href="products.html">Products</a>
          <a href="track.html" data-track-order-open>Order Status</a>
          <a href="home.html#about-us">About Us</a>
          <a href="home.html#contact">Contact</a>
        </nav>
        <div class="footer-contact" aria-label="Bakery contact information">
          <a href="tel:09101158032"><i class="fas fa-phone" aria-hidden="true"></i> 09101158032</a>
          <a href="mailto:crbwebake@gmail.com"><i class="fas fa-envelope" aria-hidden="true"></i> crbwebake@gmail.com</a>
        </div>
      </div>
      <div class="footer-bottom">
        &copy; 2026 Crumbs N' Roll Bakery. All Rights Reserved.
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="../js/config.js?v=2.3"></script>
  <script src="../js/utils.js?v=2.3"></script>
  <script src="../js/shop-api.js?v=2.3"></script>
  <script src="../js/otp.js?v=2.3"></script>
  <script src="../js/modals.js?v=2.3"></script>
  <script src="../js/main.js?v=2.4"></script>
  <script src="../js/auth.js?v=2.3"></script>
  <script src="../js/tracking.js?v=2.3"></script>

</html>
